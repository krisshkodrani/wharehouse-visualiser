server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: warehouse-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${DATABASE_USER:warehouse}
    password: ${DATABASE_PASSWORD:warehouse}
  flyway:
    locations: classpath:db/migration
logging:
  # Console keeps the readable Spring pattern so a live demo and `docker compose logs`
  # stay scannable; the file carries ECS JSON for jq. Spring Boot configures the two
  # independently, which is why both are possible without a second appender.
  file:
    name: ${LOG_FILE:/var/log/warehouse/backend.json}
  structured:
    format:
      file: ecs
    json:
      context:
        # MDC is where correlationId, orderId, taskId, vehicleId and loadId live, so
        # including it is what makes a record queryable rather than just readable.
        include: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
warehouse:
  mqtt-url: ${MQTT_URL:tcp://localhost:1883}
  mqtt-user: ${MQTT_USER:warehouse}
  mqtt-password: ${MQTT_PASSWORD:warehouse}
  ai-provider: ${AI_PROVIDER:mock}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  openrouter-provider: ${OPENROUTER_PROVIDER:}
  openrouter-timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}
