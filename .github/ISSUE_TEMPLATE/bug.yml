name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: outcome
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Logs or screenshots, with secrets removed }
