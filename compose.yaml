name: warehouse-visualizer
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    volumes:
      - warehouse-postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mosquitto_passwd -b -c /mosquitto/data/passwords warehouse warehouse && chmod 644 /mosquitto/data/passwords && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - warehouse-mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u warehouse -P warehouse -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/warehouse
      DATABASE_USER: warehouse
      DATABASE_PASSWORD: warehouse
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: warehouse
      MQTT_PASSWORD: warehouse
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_PROVIDER: ${OPENROUTER_PROVIDER:-}
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    environment:
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: warehouse
      MQTT_PASSWORD: warehouse
      AGV_SPEED: ${AGV_SPEED:-4.0}
    depends_on:
      mosquitto: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }

volumes:
  warehouse-postgres17:
  warehouse-mosquitto:
