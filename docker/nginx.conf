server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /resources/ {
    try_files $uri =404;
  }

  # Missing static assets must not fall through to index.html. UI5 treats
  # Component-preload.js as optional and falls back to Component.js on 404.
  location ~* \.(?:js|mjs|css|json|xml|map|properties|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
