# Production nginx config. Mirrors docker/nginx.conf and adds rate limiting.
#
# Deliberately a separate file rather than a change to docker/nginx.conf: that file is
# used by the local stack and by the docker-compose e2e job, and a 6r/m limit on
# putaway submissions would make the suite flake. Keep the two in sync when routing
# changes; only the limiting below is prod-only.
#
# Sits behind Caddy, which terminates TLS. Caddy is the only listener on 0.0.0.0.

# Only POSTs consume the LLM budget. Both LLM-backed paths are also GET routes the UI
# reads, so keying on the method leaves an empty key for everything else — and nginx
# does not count requests with an empty key.
map $request_method $llm_key {
    POST    $binary_remote_addr;
    default "";
}

# ~6 putaway submissions per IP per minute. These are the only two routes that reach
# PlacementAdvisor and therefore the only ones that cost money.
limit_req_zone $llm_key            zone=llm:10m rate=6r/m;
# Broad backstop for everything else under /api/.
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

# 503 rather than the default 429, so it reads as "busy" to a casual visitor.
limit_req_status 503;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Exact-match so these win over the /api/ prefix below. Both reach the LLM:
  # WarehouseController.java:34 and :80 (the latter only when type=PUTAWAY, which
  # nginx cannot see — limiting the whole route is the conservative choice).
  location = /api/v1/warehouses/linz/putaway-requests {
    limit_req zone=llm burst=3 nodelay;
    proxy_pass http://backend:8080/api/v1/warehouses/linz/putaway-requests;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/v1/warehouses/linz/transport-orders {
    limit_req zone=llm burst=3 nodelay;
    proxy_pass http://backend:8080/api/v1/warehouses/linz/transport-orders;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Not rate limited: one long-lived connection per browser, and dropping it would
  # freeze the 3D view.
  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /resources/ {
    try_files $uri =404;
  }

  # Missing static assets must not fall through to index.html. UI5 treats
  # Component-preload.js as optional and falls back to Component.js on 404.
  location ~* \.(?:js|mjs|css|json|xml|map|properties|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
