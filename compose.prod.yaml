# Production topology for the Lightsail deployment at whv.aipoweredapps.dev.
#
# Standalone on purpose: only this file plus docker/Caddyfile, docker/nginx.prod.conf
# and docker/mosquitto.conf are copied to the instance. Nothing is built there — images
# come from GHCR, published by .github/workflows/release.yml on a v* tag.
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# Every value below that must not be committed is read from /opt/whv/.env (chmod 600).
# Required variables use ${VAR:?message} so a missing one fails at deploy time rather
# than surfacing later as a runtime error.
name: warehouse-visualizer

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      # Only read when the data directory is empty. Changing it later does not
      # change the running database — the volume must be wiped to rotate it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - warehouse-postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10m

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-c"]
    # The broker's own password file is written from the same variables the backend
    # and simulator use to connect. These must agree or every MQTT connection fails.
    command:
      - "mosquitto_passwd -b -c /mosquitto/data/passwords ${MQTT_USER:-warehouse} ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env} && chmod 644 /mosquitto/data/passwords && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - warehouse-mosquitto:/mosquitto/data
    healthcheck:
      # $$SYS is escaped so Compose does not substitute it.
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u ${MQTT_USER:-warehouse} -P ${MQTT_PASSWORD} -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/krisshkodrani/warehouse-visualizer-backend:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    mem_limit: 640m
    environment:
      SERVER_PORT: 8080
      # MaxRAMPercentage is of the container limit, not the host, because mem_limit
      # is set. SerialGC keeps footprint down on a 2 vCPU box with a small heap.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC"
      DATABASE_URL: jdbc:postgresql://postgres:5432/warehouse
      DATABASE_USER: ${POSTGRES_USER:-warehouse}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: ${MQTT_USER:-warehouse}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # PlacementAdvisor only rejects a blank key at request time, so fail here instead.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_PROVIDER: ${OPENROUTER_PROVIDER:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  simulator:
    image: ghcr.io/krisshkodrani/warehouse-visualizer-simulator:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC"
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: ${MQTT_USER:-warehouse}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      AGV_SPEED: ${AGV_SPEED:-2.5}
      AGV_LOADED_SPEED: ${AGV_LOADED_SPEED:-1.8}
      AGV_DOCKING_SPEED: ${AGV_DOCKING_SPEED:-0.7}
      AGV_ACCELERATION: ${AGV_ACCELERATION:-1.0}
      AGV_BRAKING: ${AGV_BRAKING:-1.5}
      AGV_BATTERY_CONSUMPTION_PER_METRE: ${AGV_BATTERY_CONSUMPTION_PER_METRE:-0.015}
    depends_on:
      mosquitto: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ghcr.io/krisshkodrani/warehouse-visualizer-frontend:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    mem_limit: 64m
    # No host port: Caddy reaches this over the Compose network. The prod nginx conf
    # adds rate limiting and is mounted over the copy baked into the image.
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    # The only service published on 0.0.0.0. Port 80 is required for the ACME
    # HTTP-01 challenge and the HTTPS redirect, not just convenience.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume repeatedly will hit Let's Encrypt
      # rate limits, so it must persist across redeploys.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  warehouse-postgres17:
    name: ${POSTGRES_VOLUME_NAME:-warehouse-visualizer_warehouse-postgres17}
  warehouse-mosquitto:
  caddy_data:
  caddy_config:
